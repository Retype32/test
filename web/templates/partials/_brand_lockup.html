{#
  Full Brink's Nexus lockup — BRINKS wordmark over a gradient NEXUS, with the
  platform tagline. Inlined rather than linked so it inherits currentColor and
  works on both the dark auth header and light surfaces.

  Set `lockup_class` before including to control sizing.
#}
<svg class="brand-lockup {{ lockup_class | default('') }}" viewBox="0 0 372 150"
     role="img" aria-label="Brink's Nexus — Cash Processing Platform"
     xmlns="http://www.w3.org/2000/svg">
  <title>Brink's Nexus &mdash; Cash Processing Platform</title>
  <defs>
    <linearGradient id="nexusFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="var(--logo-blue, #12539e)"/>
      <stop offset="42%"  stop-color="var(--logo-blue, #12539e)"/>
      <stop offset="62%"  stop-color="#8d9cae"/>
      <stop offset="82%"  stop-color="#d8b453"/>
      <stop offset="100%" stop-color="var(--logo-gold, #c9a227)"/>
    </linearGradient>
  </defs>

  <!-- Vault-stripe motif: bars thickening into the wordmark. -->
  <g fill="currentColor">
    <rect x="0"  y="8" width="3"  height="44" rx="1"/>
    <rect x="7"  y="8" width="3"  height="44" rx="1"/>
    <rect x="14" y="8" width="3"  height="44" rx="1"/>
    <rect x="21" y="8" width="4"  height="44" rx="1"/>
    <rect x="29" y="8" width="5"  height="44" rx="1"/>
    <rect x="38" y="8" width="7"  height="44" rx="1"/>
    <rect x="49" y="8" width="9"  height="44" rx="1"/>
    <rect x="62" y="8" width="12" height="44" rx="1"/>
  </g>

  <text x="78" y="52" fill="currentColor"
        font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Impact,sans-serif"
        font-weight="900" font-size="57" letter-spacing="-2.4">BRINKS</text>
  <text x="307" y="34" fill="currentColor" font-size="14"
        font-family="Arial, sans-serif">&#174;</text>

  <text x="0" y="119" fill="url(#nexusFill)"
        font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Impact,sans-serif"
        font-weight="900" font-size="62" letter-spacing="2">NEXUS</text>

  <text x="3" y="144" fill="currentColor" opacity=".82"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-weight="700" font-size="15.5" letter-spacing="2.6">CASH PROCESSING PLATFORM</text>
</svg>
