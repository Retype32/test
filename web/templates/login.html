<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Sign In — {{ settings.display_name }}</title>
    <link rel="stylesheet" href="/web/static/css/theme.css">
    {% if settings.branding_enabled %}
    <link rel="icon" type="image/svg+xml" href="/web/static/img/nexus-mark.svg">
    {% endif %}
    <script>
        (function () {
            try {
                var saved = localStorage.getItem("nexus-theme");
                if (saved === "dark" || saved === "light") {
                    document.documentElement.setAttribute("data-theme", saved);
                }
            } catch (e) { /* ignore */ }
        })();
    </script>
</head>
<body>
<div class="centered-page">
    <div class="auth-card">
        <div class="auth-header">
            {% if settings.branding_enabled %}{% include "partials/_brand_lockup.html" %}{% endif %}
        </div>
        <div class="auth-body">
            {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
            <form method="post" action="/web/login">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus
                       autocomplete="username" spellcheck="false">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required
                       autocomplete="current-password">
                <button class="btn btn-primary" type="submit">SIGN IN</button>
            </form>
        </div>
        <div class="auth-foot">Authorised personnel only &middot; All activity is logged</div>
    </div>
</div>
</body>
</html>
