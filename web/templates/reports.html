{% extends "base.html" %}
{% block title %}Reports — Brink's Nexus{% endblock %}
{% block page_title %}Reports{% endblock %}
{% block page_subtitle %}Supervisor &#9656; Reports{% endblock %}
{% block content %}

<div class="card">
    <div class="card-header">REPORT FILTERS — TRANSACTION REPORT</div>
    <div class="card-body">
        <form method="get" id="report-form" action="/web/reports/download">
            <div class="form-row">
                <div class="form-group">
                    <label>Date From</label>
                    <input type="date" name="date_from">
                </div>
                <div class="form-group">
                    <label>Date To</label>
                    <input type="date" name="date_to">
                </div>
                <div class="form-group">
                    <label>Customer ID</label>
                    <input type="text" name="customer_id" placeholder="Leave blank for all">
                </div>
                <div class="form-group">
                    <label>Location ID</label>
                    <input type="text" name="location_id" placeholder="Leave blank for all">
                </div>
            </div>
            <div class="form-row" style="margin-top:6px;">
                <button type="submit" name="format" value="xlsx" class="btn btn-gold">EXPORT TO EXCEL (.xlsx)</button>
                <button type="submit" name="format" value="csv" class="btn">EXPORT TO CSV</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
