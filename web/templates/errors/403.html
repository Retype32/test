<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Access Denied — {{ settings.display_name }}</title>
    <link rel="stylesheet" href="/web/static/css/theme.css">
    {% if settings.branding_enabled %}
    <link rel="icon" type="image/svg+xml" href="/web/static/img/nexus-mark.svg">
    {% endif %}
    <script>
        (function () {
            try {
                var saved = localStorage.getItem("nexus-theme");
                if (saved === "dark" || saved === "light") {
                    document.documentElement.setAttribute("data-theme", saved);
                }
            } catch (e) { /* ignore */ }
        })();
    </script>
</head>
<body>
<div class="centered-page">
    <div class="auth-card">
        <div class="auth-header">
            {% if settings.branding_enabled %}{% include "partials/_brand_lockup.html" %}{% endif %}
            <div class="err-code" aria-hidden="true">&#9209;</div>
            <div class="name">ACCESS DENIED</div>
            <div class="tagline">You don't have permission to view this page</div>
        </div>
        <div class="auth-body" style="text-align:center;">
            <p class="text-muted" style="margin-top:0;">{{ detail or "Insufficient permissions for this action." }}</p>
            <a class="btn btn-primary btn-block" href="/web/dashboard">Back to Dashboard</a>
        </div>
    </div>
</div>
</body>
</html>
