<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Brink's Nexus">
  <title>Brink's Nexus</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c86a"/>
      <stop offset="1" stop-color="#b8891a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b74c0"/>
      <stop offset="1" stop-color="#0e3d6f"/>
    </linearGradient>
  </defs>

  <!-- Converging flows: gold arrows out on the diagonals, blue arrows in on
       the axes, meeting at a single hub — the nexus the product is named for. -->
  <g stroke="url(#gold)" stroke-width="3.1" stroke-linecap="round" fill="none">
    <path d="M14 14 L24 24"/><path d="M50 14 L40 24"/>
    <path d="M14 50 L24 40"/><path d="M50 50 L40 40"/>
  </g>
  <g fill="url(#gold)">
    <path d="M11 11 l8.4 1.1 -7.3 7.3 z"/>
    <path d="M53 11 l-1.1 8.4 -7.3 -7.3 z"/>
    <path d="M11 53 l1.1 -8.4 7.3 7.3 z"/>
    <path d="M53 53 l-8.4 -1.1 7.3 -7.3 z"/>
  </g>

  <g stroke="url(#blue)" stroke-width="3.4" stroke-linecap="round" fill="none">
    <path d="M32 6 L32 21"/><path d="M32 58 L32 43"/>
    <path d="M6 32 L21 32"/><path d="M58 32 L43 32"/>
  </g>
  <g fill="#12539e">
    <path d="M32 25 l-5 -6 h10 z"/>
    <path d="M32 39 l5 6 h-10 z"/>
    <path d="M25 32 l-6 -5 v10 z"/>
    <path d="M39 32 l6 5 v-10 z"/>
  </g>

  <circle cx="32" cy="32" r="6.6" fill="none" stroke="#12539e" stroke-width="3.4"/>
</svg>
